<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC MEDIA - Música que nos marca</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: white; font-family: Arial, sans-serif; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: #000; }
        .logo { font-weight: bold; font-size: 18px; }
        nav a { color: white; text-decoration: none; margin-left: 30px; font-size: 14px; }
        nav a:hover { color: #1db954; }
        .hero { text-align: center; padding: 120px 20px; background: #000; min-height: 80vh; }
        .hero h1 { font-size: 60px; font-weight: 900; margin-bottom: 30px; line-height: 1.1; }
        .wave { width: 300px; height: 60px; background: repeating-linear-gradient(to right, #4a90e2 0px, #4a90e2 4px, transparent 4px, transparent 8px); margin: 20px auto; opacity: 0.7; }
        .hero p { font-size: 16px; margin: 30px 0; line-height: 1.6; color: #ccc; max-width: 600px; margin-left: auto; margin-right: auto; }
        .btn { display: inline-block; border: 2px solid white; padding: 12px 40px; color: white; text-decoration: none; margin-top: 20px; }
        .btn:hover { background: white; color: black; }
        @media (max-width: 768px) { 
            header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .hero h1 { font-size: 40px; }
            nav a { margin: 0 10px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🎧 MUSIC MEDIA</div>
        <nav>
            <a href="#inicio">INICIO</a>
            <a href="#descubre">DESCUBRE</a>
            <a href="#recursos">RECURSOS</a>
        </nav>
    </header>
    <main id="inicio">
        <div class="hero">
            <h1>MÚSICA QUE NOS<br>MARCA</h1>
            <div class="wave"></div>
            <p>Sin géneros favoritos ni playlists genéricas. Solo música que vale la pena<br>
            escuchar, compartir y entender. Tu nueva parada antes de Spotify</p>
            <a href="#" class="btn">BLOG</a>
        </div>
    </main>
</body>
</html>
